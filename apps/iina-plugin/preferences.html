<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <div class="pref-section">
    <label
      >Bridge port
      <input data-pref-key="bridge_port" data-type="int" type="number" min="1" max="65535"
    /></label>
  </div>
  <div class="pref-section">
    <label
      >Local bridge token <input data-pref-key="bridge_token" type="password" autocomplete="off"
    /></label>
    <p class="small secondary pref-help">
      Copy this token from Sofa Remote on your Mac. It stays in this local IINA plugin preference
      and is never sent to a page.
    </p>
  </div>
</html>
